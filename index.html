  <style id="crickcast-motion-polish">

    function normalizeChannelEntries(data) {

        if (seen[url]) return;

      function scan(value, key) {
        if (!value) return;
        if (Array.isArray(value)) {

        if (typeof value !== 'object') return;
        var url = value.url || value.link || value.href || value.telegram || value.telegramUrl || value.channelUrl || value.invite;
        var name = value.name || value.title || value.channelName || value.label;
        var desc = value.description || value.subtitle || value.about;
        if (typeof url === 'string') add(url, name, desc);
        Object.keys(value).forEach(function (k) {

var popupClosing = false;

    function addShimmer() {

    function isSafeFrameUrl(url) {
      return typeof url === 'string' && url.trim() !== '' && !/^\s*(javascript|data|vbscript):/i.test(url);
    }

    function findStream(data, candidates) {
      if (!data || !Array.isArray(data.iframes)) return null;

      var index = {};
      for (var i = 0; i < data.iframes.length; i++) {
        var item = data.iframes[i];
        if (!item || item.id === undefined || item.id === null) continue;
        var key = 'k_' + String(item.id).trim().toLowerCase();
        if (!Object.prototype.hasOwnProperty.call(index, key)) index[key] = item;
      }

      for (var j = 0; j < candidates.length; j++) {
        var want = 'k_' + candidates[j].toLowerCase();
        if (Object.prototype.hasOwnProperty.call(index, want)) return index[want];
      }
      return null;
    }

    function loadStream(candidates) {
      var frame = document.getElementById('videoFrame');
      var titleEl = document.getElementById('pageTitle');

      if (!candidates.length) {
        showError('NO STREAM SELECTED', 'No stream ID found in this link. Open the link exactly as shared.');
        return;
      }

      addShimmer();

      prefetchData().then(function (data) {
        if (!data) {
          showError('CONNECTION ERROR', 'Could not load the stream list. Check your internet connection and refresh the page.');
          return;
        }

        var found = findStream(data, candidates);

        if (found && isSafeFrameUrl(found.iframeSrc)) {
          var streamName = String(found.name || '').trim() || 'Live Stream';
          currentStreamId = String(found.id).trim();

          frame.addEventListener('load', function onLoad() {
            frame.removeEventListener('load', onLoad);
            removeShimmer();
          });

          frame.addEventListener('error', function onErr() {
            frame.removeEventListener('error', onErr);
            removeShimmer();
          });

          setTimeout(removeShimmer, 12000);

          frame.src = found.iframeSrc;
          if (titleEl) titleEl.textContent = streamName;
          document.title = streamName + ' \u2013 ' + SITE_NAME;
        } else {
          showError('STREAM NOT FOUND', 'Stream Not Found');
        }
      });
    }


      function safeDecode(v) {
      try { return decodeURIComponent(String(v).replace(/\+/g, ' ')); }
      catch (e) { return String(v); }
    }

    function collectIdCandidates(query) {
      var named = [];
      var bare = [];
      var pairs = String(query || '').replace(/^[?#]+/, '').split('&');

      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i]) continue;

        var eq = pairs[i].indexOf('=');
        var key = safeDecode(eq === -1 ? pairs[i] : pairs[i].slice(0, eq)).trim().replace(/^\/+|\/+$/g, '');
        var val = eq === -1 ? '' : safeDecode(pairs[i].slice(eq + 1)).trim();

        if (!key) continue;

        if (key.toLowerCase() === 'id') {
          if (val) named.push(val);
        } else if (!val) {
          bare.push(key);
        }
      }

      return named.concat(bare);
    }

    function resolveCandidates() {
      var list = collectIdCandidates(window.location.search);
      if (window.location.hash) list = list.concat(collectIdCandidates(window.location.hash));

      var seen = {};
      var out = [];
      for (var i = 0; i < list.length && out.length < 12; i++) {
        var id = list[i].slice(0, 100);
        var k = id.toLowerCase();
        if (!id || seen['k_' + k]) continue;
        seen['k_' + k] = true;
        out.push(id);
      }
      return out;
    }

    function buildShareUrl() {
      if (!currentStreamId) return window.location.href;
      return window.location.protocol + '//' + window.location.host + window.location.pathname +

          e.preventDefault();

        }
      });
    }

    function copyLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(function () { showToast('Link Copied to Clipboard !!'); })
          .catch(function () { fallbackCopy(url); });
      } else {
        fallbackCopy(url);

    }

        if (navigator.share) {
          navigator.share({ title: title, text: text, url: url }).catch(function (err) {
            // Cancelled by the user: do nothing. Any other failure: copy the link instead.
            if (err && err.name === 'AbortError') return;
            copyLink(url);
          });
          return;
        }

        copyLink(url);
      });
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      try {
        document.execCommand('copy');
        showToast('Link Copied to Clipboard !!');
      } catch (e) {
        alert('Link: ' + text);
      }
      document.body.removeChild(ta);

    function showToast(msg) {
      var old = document.getElementById('cfcToast');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      var toast = document.createElement('div');

        'transform:translateX(-50%) translateY(10px)',

        'white-space:nowrap',
        'z-index:9999',
        'opacity:0',
        'transition:opacity 0.3s,transform 0.3s',
        'pointer-events:none'
      ].join(';');

      document.body.appendChild(toast);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
        });
      });

      setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';

          if (toast.parentNode) toast.parentNode.removeChild(toast);

        var fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                   document.mozFullScreenElement || document.msFullscreenElement;
        var orientation = window.screen && screen.orientation;
        if (!orientation) return;

        try {
          if (fsEl) {
            // lock() returns undefined on some older browsers, so guard before .catch()
            var p = orientation.lock && orientation.lock('landscape');
            if (p && typeof p.catch === 'function') p.catch(function () {});
          } else if (orientation.unlock) {
            orientation.unlock();
          }
        } catch (e) {}
      }

      document.addEventListener('fullscreenchange', handleFsChange);
      document.addEventListener('webkitfullscreenchange', handleFsChange);
      document.addEventListener('mozfullscreenchange', handleFsChange);
      document.addEventListener('MSFullscreenChange', handleFsChange);
    }

    function initJoinCard() {
      var popupJoin = document.getElementById('popupJoinLink');
      if (popupJoin) popupJoin.href = POPUP_JOIN_LINK;
      loadChannelsFromJson();
    }

    function initPopupButtons() {
      var btnJoined = document.getElementById('btnAlreadyJoined');
      if (btnJoined) btnJoined.addEventListener('click', alreadyJoined);

      var btnClose = document.getElementById('popupClose');
      if (btnClose) btnClose.addEventListener('click', closePopup);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') closePopup();
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initPopupButtons();

      initJoinCard();
      initBell();
      initShareButton();
      initFullscreenHandler();
      applyRandomHeartColor();
      loadStream(resolveCandidates());
    });
  </script>
</body>

</html>
